name: 宣伝の投稿案づくり

# 毎日 12:15 JST に 𝕏 の投稿案、毎週月曜 7:05 JST にブログ記事の案を作る。
# site.config.json の promo.auto が false の間は Issue で確認、true なら即投稿。
on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '5 22 * * 0'
  workflow_dispatch:
    inputs:
      kind:
        description: 作るもの
        type: choice
        options: [x, article]
        default: x

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 種類を決める
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "kind=$INPUT_KIND" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "5 22 * * 0" ]; then echo "kind=article" >> "$GITHUB_OUTPUT"
          else echo "kind=x" >> "$GITHUB_OUTPUT"; fi
      - name: 投稿案を作る（確認モードなら Issue、自動モードなら投稿）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: node scripts/promo/action.mjs draft "${{ steps.kind.outputs.kind }}"
